<!DOCTYPE html>
<html lang="en" >
<head>
<meta charset="UTF-8">
<title>Multi Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Noto+Sans+JP&display=swap" rel="stylesheet">
<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css' type='text/css' media='all' />
<link rel="stylesheet" href="./style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
</head>
<body>

<main>

<div class="filter_container">
    <input type="text" placeholder="Filter counters..." class="filter_input">
</div>

<!-- Dedicated scroll container -->
<div class="scroll_container">
    <div class="items">
        <div class="item">
            <div class="item_timestamp"></div>
            <div class="item_title">
                <button class="btn_reset"></button>
                <input type="text" placeholder="" autocapitalize="on">
                <button class="btn_minus"></button>
                <button class="btn_plus"></button>
            </div>
        </div>
    </div>
</div>

</main>

<script  src="./script.js"></script>

</body>
</html>
